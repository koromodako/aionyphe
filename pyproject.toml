[project]
name = "aionyphe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["onyphe", "api", "cli", "asyncio"]
description = "Asynchronous Onyphe API and CLI"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
  { name="koromodako", email="koromodako@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = [
    "rich~=15.0",
    "aiodns~=4.0",
    "aiohttp~=3.14",
]


[project.urls]
"Homepage" = "https://github.com/koromodako/aionyphe"
"Repository" = "https://github.com/koromodako/aionyphe"
"Bug Tracker" = "https://github.com/koromodako/aionyphe/issues"


[project.scripts]
aionyphe = "aionyphe.main:app"


[build-system]
requires = ["setuptools>=83", "setuptools_scm>=10", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["aionyphe", "aionyphe.*"]


[tool.setuptools_scm]
version_file = "aionyphe/__version__.py"


[tool.ruff]
include = ["pyproject.toml", "aionyphe/**/*.py"]
exclude = ["aionyphe/__version__.py"]
line-length = 79


[tool.ruff.format]
quote-style = "preserve"
